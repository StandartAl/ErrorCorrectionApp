spring:
  application:
    name: errorcorrection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/errorcorrection}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  scheduler:
    enabled: true
    interval-ms: 3000
  yandex:
    speller-url: https://speller.yandex.net/services/spellservice.json/checkTexts

logging:
  level:
    root: INFO
    com.project.errorcorrection: DEBUG
